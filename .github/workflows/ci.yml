name: ci

on:
  push:
  pull_request:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      # The toolchain, and the lints it enforces, come from rust-toolchain.toml: one place names the
      # version, so the gate below cannot pass on a machine and fail on the runner.
      - name: Toolchain
        run: rustup toolchain install
      - name: Format
        run: cargo fmt --all -- --check
      # The instant checks first: this one was hidden behind Clippy's failure for several runs, which
      # is what a slow gate in front of a fast one buys.
      #
      # `explain.rs` is on the list because it *renders* the lowering - the Cranelift function text is
      # what `--explain` prints - so the name is the back end's, printed by a module that is the back
      # end's in all but directory. Everything else under `src/` is a front end and may not name one
      # (CONSTRAINTS 1).
      - name: The front end names no back end
        shell: bash
        run: |
          if grep -rnE 'cranelift|iced_x86' crates/xcc/src --include='*.rs'               | grep -vE 'crates/xcc/src/(back|jit|capi)/|crates/xcc/src/explain\.rs:'; then
            echo 'a front end module mentioned a back end (CONSTRAINTS 1)'
            exit 1
          fi
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      # A failing test is reported *as an annotation*, so the failure is visible on the check without
      # opening a log - and so it can be read by anything that can read the API, which is what a
      # maintainer without the browser needs.
      - name: Test
        shell: bash
        run: |
          set -o pipefail
          cargo test --workspace 2>&1 | tee "$RUNNER_TEMP/test.log"
      - name: Report the failing tests
        if: failure()
        shell: bash
        run: |
          # `-A2` carries the assertion's own message, which is on the lines *after* the panic: the
          # first version printed the location and dropped the reason, so a failing run said which
          # test and not why it failed.
          grep -A2 -E '^(    [A-Za-z0-9_:]+$|thread .* panicked at|test result: FAILED)' "$RUNNER_TEMP/test.log"             | head -60             | while IFS= read -r line; do echo "::error::xcc ci: $line"; done
          exit 1
      - name: Release build
        run: cargo build --workspace --release
