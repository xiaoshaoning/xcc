[workspace]
resolver = "2"
members = ["crates/xcc", "crates/xcc-cli", "crates/xcc-capi", "crates/bcc20-sys"]

[workspace.package]
version = "0.1.9"
edition = "2021"
license = "MIT"
rust-version = "1.82"

[workspace.dependencies]
xcc = { path = "crates/xcc" }
clap = { version = "4", features = ["derive"] }
