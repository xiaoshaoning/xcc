# One place names the toolchain.
#
# The gate is `clippy -D warnings` and `fmt --check`, and a local clippy older than the runner's is a
# gate that passes here and fails there: at 0.1.3 the local toolchain was 1.94 and the runner's 1.98,
# which asks for a `while let` that 1.94 is happy with. A gate whose result depends on the machine is
# not a gate.
#
# The version, not the triple: each machine resolves its own host, so a local checkout uses the gnu
# build and the CI runner the msvc one, and the lints are the same either way.
[toolchain]
channel = "1.98.1"
components = ["rustfmt", "clippy"]
